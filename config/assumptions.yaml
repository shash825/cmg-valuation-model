# All modeling assumptions live here so they're easy to find, cite, and change
# without touching any code. Every number below is explained in the README's
# "Methodology & Assumptions" section.

target:
  ticker: CMG
  base_fiscal_year: 2025          # last actual reported fiscal year, used as the DCF's starting point

comps:
  # Fast-casual / restaurant peer set used for the comparable companies analysis
  tickers: [SG, SHAK, WING, DPZ, YUM, CAVA]

dcf:
  projection_years: 5

  # Annual revenue growth for each projected year (FY2026-FY2030).
  # Y1-Y2 anchor to analyst consensus; growth fades toward a sustainable
  # long-run rate as the restaurant base matures.
  revenue_growth:
    - 0.092   # FY2026
    - 0.100   # FY2027
    - 0.090   # FY2028
    - 0.080   # FY2029
    - 0.070   # FY2030

  # Operating margin (EBIT / revenue) for each projected year. Recent 4-year
  # actual range was 14.0%-17.5%; assumes modest, gradual operating leverage.
  operating_margin:
    - 0.165   # FY2026
    - 0.168   # FY2027
    - 0.171   # FY2028
    - 0.173   # FY2029
    - 0.175   # FY2030

  # Capital expenditure as % of revenue, tapering slightly as unit growth normalizes.
  capex_pct_revenue:
    - 0.055
    - 0.054
    - 0.052
    - 0.051
    - 0.050

  # D&A as % of revenue, held flat near the recent actual (~3.0%).
  da_pct_revenue:
    - 0.030
    - 0.030
    - 0.030
    - 0.030
    - 0.030

  # Change in net working capital as % of the year-over-year CHANGE in revenue.
  # Working capital is a balance-sheet stock, so only its movement is a cash
  # flow -- each incremental dollar of revenue ties up ~2 cents of net working
  # capital here. That is deliberately conservative for a restaurant: CMG
  # collects from guests immediately and pays suppliers on terms, so it runs
  # negative working capital and growth arguably RELEASES cash. Set this
  # negative to model that; the positive value keeps the base case cautious.
  nwc_pct_revenue_change:
    - 0.020
    - 0.020
    - 0.020
    - 0.020
    - 0.020

  tax_rate: 0.25
  terminal_growth_rate: 0.030

  # Sensitivity table ranges
  sensitivity:
    wacc_range: [0.075, 0.080, 0.085, 0.090, 0.095, 0.100, 0.105]
    terminal_growth_range: [0.020, 0.025, 0.030, 0.035, 0.040]

wacc:
  # Method: cost-of-equity-only. CMG carries no traditional bonds/bank debt --
  # its only "debt" on record is capitalized operating lease liabilities, which
  # are already expensed above the operating-income line. WACC is set equal to
  # the cost of equity (CAPM) rather than blending in lease liabilities as if
  # they were financial debt. See README for the alternative treatment considered.
  risk_free_rate: 0.048     # 10Y US Treasury yield
  equity_risk_premium: 0.050
  beta_source: yfinance     # 5Y monthly beta

equity_bridge:
  # Rent expense is already deducted above the operating-income line, so the
  # cost of CMG's leases is ALREADY inside the unlevered free cash flow this
  # model discounts. Subtracting the capitalized lease liability again in the
  # EV -> equity bridge would charge shareholders twice for the same
  # obligation. Set treat_leases_as_debt: true only if you also add rent back
  # to EBIT and depreciate the right-of-use asset. See src/dcf/equity_bridge.py.
  treat_leases_as_debt: false

  # Fraction of reported total debt that is capitalized operating leases rather
  # than bonds or bank borrowings. CMG has no traditional financial debt, so
  # all of its reported ~$5.4B "debt" is lease liability.
  lease_share_of_total_debt: 1.0

  # The comps bridge intentionally ignores the settings above. Peer EV/Revenue
  # and EV/EBITDA multiples are quoted on a lease-INCLUSIVE enterprise value,
  # so applying them to CMG requires a lease-inclusive bridge to stay
  # apples-to-apples. Mixing the two conventions is the error being avoided.
